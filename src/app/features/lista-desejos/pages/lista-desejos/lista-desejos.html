<div class="container" style="margin-top: 90px; max-width: 800px;">

    <h2 class="mb-4"> Lista de Desejos</h2>

    <div *ngIf="erro()" class="alert alert-danger">{{ erro() }}</div>

    <div *ngIf="itens().length === 0 && !erro()" class="text-center py-5">
        <p class="text-muted fs-5">Sua lista de desejos está vazia.</p>
        <a routerLink="/cervejas" class="btn btn-outline-success mt-2">Explorar cervejas</a>
    </div>

    <div class="card mb-3" *ngFor="let item of itens()">
        <div class="card-body d-flex align-items-center gap-3">

            <!-- imagem -->
            <a [routerLink]="['/cervejas', item.cervejaId]">
                <img *ngIf="item.imagem" [src]="getImagemUrl(item.cervejariaId, item.imagem)"
                    style="width: 70px; height: 70px; object-fit: contain;" />
            </a>

            <!-- info -->
            <div class="flex-grow-1">
                <a [routerLink]="['/cervejas', item.cervejaId]" class="text-decoration-none text-dark">
                    <h5 class="mb-1">{{ item.rotulo }}</h5>
                </a>
                <div class="text-muted small">{{ item.cervejaria }}</div>
                <div class="fw-bold text-success">R$ {{ item.preco | number:'1.2-2' }}</div>
            </div>

            <!-- ações -->
            <div class="d-flex flex-column gap-2" style="min-width: 150px;">
                <button class="btn btn-success btn-sm" (click)="adicionarCarrinho(item.cervejaId)"
                    [disabled]="!item.disponivel">
                    {{ item.disponivel ? 'Adicionar ao Carrinho' : 'Indisponível' }}
                </button>
                <button class="btn btn-outline-danger btn-sm" (click)="remover(item.cervejaId)">
                    Remover
                </button>
            </div>

        </div>
    </div>

</div>
