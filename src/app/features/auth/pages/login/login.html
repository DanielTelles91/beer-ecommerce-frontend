<div class="container d-flex justify-content-center" style="margin-top: 100px;">
    <div class="card p-4" style="max-width: 400px; width: 100%;">

        <h3 class="mb-3">Entrar</h3>

        <form [formGroup]="form" (ngSubmit)="entrar()">

            <div class="mb-3">
                <label class="form-label">E-mail</label>
                <input type="email" class="form-control" formControlName="email" />
            </div>

            <div class="mb-3">
                <label class="form-label">Senha</label>
                <input type="password" class="form-control" formControlName="senha" />
            </div>

            <div *ngIf="erro()" class="alert alert-danger">
                {{ erro() }}
            </div>

            <button type="submit" class="btn btn-success w-100" [disabled]="carregando()">
                {{ carregando() ? 'Entrando...' : 'Entrar' }}
            </button>

            <p class="text-center mt-3 mb-0">
                Não tem conta? <a routerLink="/cadastro">Cadastre-se</a>
            </p>

        </form>
    </div>
</div>
