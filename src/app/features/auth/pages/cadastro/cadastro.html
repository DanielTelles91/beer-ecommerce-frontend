<div class="container d-flex justify-content-center" style="margin-top: 60px;">
    <div class="card p-4" style="max-width: 450px; width: 100%;">

        <h3 class="mb-3">Criar conta</h3>

        <div *ngIf="sucesso()" class="alert alert-success">
            Cadastro realizado! Verifique seu e-mail para confirmar a conta antes de fazer login.
        </div>

        <form *ngIf="!sucesso()" [formGroup]="form" (ngSubmit)="cadastrar()">
            <div class="mb-2"><input class="form-control" placeholder="Nome" formControlName="first_name" /></div>
            <div class="mb-2"><input class="form-control" placeholder="Sobrenome" formControlName="last_name" /></div>
            <div class="mb-2"><input class="form-control" placeholder="E-mail" formControlName="email" /></div>
            <div class="mb-2"><input class="form-control" placeholder="CPF" formControlName="cpf" /></div>
            <div class="mb-2"><input class="form-control" placeholder="Telefone" formControlName="telefone" /></div>
            <div class="mb-2"><input class="form-control" type="date" formControlName="data_nascimento" /></div>
            <div class="mb-2"><input class="form-control" type="password" placeholder="Senha" formControlName="senha" />
            </div>
            <div class="mb-2"><input class="form-control" type="password" placeholder="Confirmar senha"
                    formControlName="confirmarSenha" /></div>

            <div *ngIf="erro()" class="alert alert-danger">{{ erro() }}</div>

            <button type="submit" class="btn btn-success w-100 mt-2" [disabled]="carregando()">
                {{ carregando() ? 'Cadastrando...' : 'Cadastrar' }}
            </button>
        </form>
    </div>
</div>
